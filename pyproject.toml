[project]
name = "chat-deepseek-to-openai-api"
version = "1.0.0"
description = "FastAPI proxy exposing chat.deepseek.com as an OpenAI-compatible API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.141.1",
  "httpx>=0.28.1",
  "pydantic>=2.13.4",
  "uvicorn>=0.52.1",
  "wasmtime==48.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
preview-features = true

[tool.ty.rules]
all = "error"

[tool.ty.analysis]
strict-equality-semantics = true
strict-generic-narrowing = true

[tool.ty.terminal]
error-on-warning = true
output-format = "concise"

[tool.ty.environment]
python-version = "3.12"
